name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 8.4.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$(python -c 'from healthpro import __version__; print(__version__)')"
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$VERSION" ]; then
            echo "Requested version does not match source" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag does not match source version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libgl1-mesa-dev \
            libegl1 \
            libfuse2 \
            desktop-file-utils

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller HealthPro_linux.spec --clean --noconfirm

      - name: Build .deb package
        run: bash linux/build_deb.sh

      - name: Build AppImage
        run: bash linux/build_appimage.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthpro-deb
          path: build/healthpro_*.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthpro-appimage
          path: dist/HealthPro-*-x86_64.AppImage

